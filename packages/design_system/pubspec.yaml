name: design_system
description: Shared theme, colors, and market branding used by every app and feature package.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  dio: ^5.4.3
  image_picker: ^1.1.2
  jwt_decoder: ^2.0.1
  core:
    path: ../core
  models:
    path: ../models

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
