name: customer_experience
description: >
  Catalog browsing, cart, and order/checkout for customers — combined into one
  package for now because the code is genuinely mutually coupled (catalog
  cards need cart's add-button and favorite state, checkout needs cart+order+
  review-eligibility, order screens embed catalog product cards). See
  MODULAR_ARCHITECTURE_PLAN.md — this is the Customer Experience team's
  package; split further only once real ownership boundaries need it.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  dio: ^5.4.3
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.1
  auth:
    path: ../auth
  core:
    path: ../../packages/core
  design_system:
    path: ../../packages/design_system
  i18n:
    path: ../../packages/i18n
  location:
    path: ../location
  models:
    path: ../../packages/models
  notification:
    path: ../notification
  payment:
    path: ../payment
  profile:
    path: ../profile
  review:
    path: ../review

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
